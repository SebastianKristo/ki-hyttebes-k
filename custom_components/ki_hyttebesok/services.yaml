les_kalender:
  name: Les kalenderen på nytt
  description: Henter besøkshistorikken fra kalenderen med en gang.

registrer_opphold:
  name: Registrer et opphold
  description: Legger inn et besøk som ikke ble fanget opp automatisk.
  fields:
    person:
      name: Person
      required: true
      selector: { text: }
    fra:
      name: Fra dato
      required: true
      selector: { date: }
    til:
      name: Til dato (siste natt)
      selector: { date: }
    sted:
      name: Sted
      selector: { text: }

hvor_var_vi:
  name: Hvor var vi?
  description: Svarer på hvor hver person var i en gitt helg, uke eller dato.
  fields:
    uke:
      name: Ukenummer
      example: 32
      selector: { number: { min: 1, max: 53, mode: box } }
    aar:
      name: År
      selector: { number: { min: 2020, max: 2100, mode: box } }
    dato:
      name: Dato
      description: Brukes i stedet for uke
      selector: { date: }
    antall:
      name: Antall helger
      description: Uten uke eller dato får du de siste helgene
      default: 8
      selector: { number: { min: 1, max: 52, mode: box } }
